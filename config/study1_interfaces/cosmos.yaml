# Study I - frozen visual interface comparison (Global-Softmax, 10 epochs)
# cosmos

# --- Output ---
results_dir: ${NWM_RUN_ROOT}/study1_interfaces
run_name: cosmos
wandb:
  enabled: false
  project: nwm-rep-history
  entity: null

# --- Data ---
datasets:
  recon:
    data_folder: ${NWM_DATA_ROOT}/processed/recon
    train: data_splits/recon/train
    test: data_splits/recon/test
    goals_per_obs: 4
  sacson:
    data_folder: ${NWM_DATA_ROOT}/processed/sacson
    train: data_splits/sacson/train
    test: data_splits/sacson/test
    goals_per_obs: 4
  scand:
    data_folder: ${NWM_DATA_ROOT}/processed/scand
    train: data_splits/scand/train
    test: data_splits/scand/test
    goals_per_obs: 4
eval_datasets:
  recon:
    data_folder: ${NWM_DATA_ROOT}/processed/recon
    test: data_splits/recon/test
    goals_per_obs: 4
  sacson:
    data_folder: ${NWM_DATA_ROOT}/processed/sacson
    test: data_splits/sacson/test
    goals_per_obs: 4
  scand:
    data_folder: ${NWM_DATA_ROOT}/processed/scand
    test: data_splits/scand/test
    goals_per_obs: 4
dataset_index_root: ${NWM_DATA_ROOT}/index-cache
image_size: 224
context_size: 8
len_traj_pred: 64
distance:
  min_dist_cat: -64
  max_dist_cat: 64
normalize: true
balanced_sampling: true
balanced_samples_per_epoch: min
deterministic_data_sampling: true
num_workers: 6

# --- Frozen visual interface ---
tokenizer:
  type: cosmos_ci16x16
  checkpoint_dir: ${NWM_MODEL_ROOT}/tokenizers/cosmos-ci16x16
  input_size: 256
  dtype: bf16
config_path: RAE/configs/stage1/DINOv2-B.yaml
model_in_channels: 16

# --- Dynamics model (CDiT-B/2 + DDT head) ---
model: CDiT-B/2
model_init_seed: 424242
paired_reference_in_channels: 768
learn_sigma: false
mlp_ratio: 4.0
head_width: 2048
head_depth: 2
head_num_heads: 16
head_attention_layout: global

# --- History mixer ---
attention_mode: softmax
backbone_mode: dit
self_attention_layout: global
gdn_softmax_every: 4
gdn_conv_kernel_size: 4
linear_feature_scaling: false

# --- iREPA alignment (training only) ---
repa_mode: none
repa_coeff: 0.0
repa_layer_depth: 8
repa_kernel_size: 3
repa_spatial_alpha: 1.0
repa_eps: 1.0e-06

# --- Flow matching ---
transport:
  model_type: velocity
  path_type: linear
  loss_type: velocity
  time_dist_type: uniform
  time_dist_shift_disable: false
  num_steps: 50
  sampling_method: euler

# --- Optimization ---
epochs: 10
batch_size: 48
train_microbatch_size: 8
lr: 0.0002
final_lr: 2.0e-06
lr_schedule: linear
lr_schedule_total_steps: 98100
betas:
- 0.9
- 0.999
grad_clip_val: 1.0
exact_resume: true
override_lr_on_resume: false

# --- Evaluation ---
eval_batch_size: 1
eval_num_batches: 8
planning_score_type: dino
planning_traj_sampler: curve
dreamsim_cache_dir: ${NWM_MODEL_ROOT}/dreamsim

# --- Reproducibility checks ---
expected_world_size: 2
parameter_budget_trainable: 360577892
parameter_tolerance: 1.0e-06
